<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0f14">
<title>Lock In — Pool Cursor</title>
<style>
:root{
  --bg:#0b0f14; --card:#141a23; --card2:#1a212c; --well:#0d1118;
  --fg:#e8eef7; --mut:#8ba0b8; --dim:#5b6b7c; --line:#232d3a;
  --acc:#39d98a; --accHi:#5df6a4; --warn:#ffb020; --red:#ff5c5c;
  --blue:#4aa8ff; --gold:#ffd166;
  --hd:'Space Grotesk',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--hd);max-width:460px;margin:0 auto;
  padding:12px 14px 48px;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.02em;font-size:15px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc)}
.sys{font-family:var(--mono);font-size:9px;color:var(--acc);letter-spacing:.12em;
  border:1px solid rgba(57,217,138,.4);padding:2px 6px;border-radius:5px}
.sess{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.08em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
label{display:block;font-family:var(--mono);font-size:9px;font-weight:600;text-transform:uppercase;
  letter-spacing:.12em;color:var(--mut);margin:0 0 6px}
select{width:100%;padding:10px;font-family:var(--mono);font-size:13px;font-weight:600;
  color:var(--fg);background:var(--well);border:1px solid var(--line);border-radius:10px;appearance:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row+.row{margin-top:10px}
.row .wide{grid-column:1/-1}
.hero{text-align:center;padding:22px 14px 18px;border-radius:16px;border:1px solid var(--line);
  margin-bottom:10px;min-height:118px;display:flex;flex-direction:column;justify-content:center;
  background:radial-gradient(130% 150% at 50% -20%,#16324a 0%,#121c26 60%,#101419 100%)}
.hero .hero-n{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1.05}
.hero .hero-l{font-family:var(--mono);font-size:10px;color:var(--mut);text-transform:uppercase;
  letter-spacing:.14em;margin-top:7px}
.hero .hero-s{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:7px;line-height:1.5}
.hero.watch .hero-n{color:var(--fg)}
.hero.lock{background:radial-gradient(130% 150% at 50% -20%,#0f402a 0%,#0a2a1b 55%,#0c2318 100%);
  border-color:var(--acc)}
.hero.lock .hero-n{color:var(--accHi);text-shadow:0 0 22px rgba(57,217,138,.35)}
.hero.lock .hero-l{color:var(--acc)} .hero.lock .hero-s{color:var(--acc)}
.hero.bad{background:radial-gradient(130% 150% at 50% -20%,#3a1416 0%,#241014 60%,#1a0e12 100%);
  border-color:var(--red)}
.hero.bad .hero-n{color:var(--red)} .hero.bad .hero-l{color:var(--red)} .hero.bad .hero-s{color:#d99}
.stats{display:flex;gap:14px;justify-content:center;font-family:var(--mono);font-size:11px;
  color:var(--dim);margin:-2px 0 12px;flex-wrap:wrap}
.stats b{color:var(--fg);font-weight:600}
#rideCard{border-color:rgba(57,217,138,.45);
  background:linear-gradient(180deg,#10251c 0%,#121a22 100%)}
#rideCard.bad{border-color:rgba(255,176,32,.45);
  background:linear-gradient(180deg,#2a2110 0%,#121a22 100%)}
.ride-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ride-net{font-family:var(--mono);font-size:32px;font-weight:800;letter-spacing:-.7px;
  font-variant-numeric:tabular-nums;line-height:1.05}
.ride-net.pos{color:var(--accHi)} .ride-net.neg{color:var(--red)} .ride-net.flat{color:var(--mut)}
.ride-meta{font-family:var(--mono);font-size:10px;color:var(--mut);text-align:right;line-height:1.7}
.ride-meta b{color:var(--fg)}
.ride-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.rg{background:var(--well);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
.rg span{display:block;font-family:var(--mono);font-size:8px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rg b{display:block;font-family:var(--mono);font-size:14px;color:var(--fg);margin-top:3px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.rg b.pos{color:var(--accHi)} .rg b.neg{color:var(--red)} .rg b.warn{color:var(--warn)}
.ledgerBtn{width:100%;margin-top:12px;padding:10px;border-radius:10px;border:1px solid var(--line);
  background:var(--card2);color:var(--mut);font-family:var(--mono);font-size:10px;font-weight:700;
  letter-spacing:.1em;cursor:pointer}
.ledgerBtn:hover{border-color:var(--acc);color:var(--accHi)}
.ledgerScroller{max-height:310px;overflow:auto;margin-top:10px;border:1px solid var(--line);
  border-radius:10px;background:var(--well)}
table.ledger{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:10px;
  font-variant-numeric:tabular-nums}
.ledger th{position:sticky;top:0;background:var(--card2);color:var(--dim);font-size:8px;
  letter-spacing:.08em;text-align:right;padding:7px 6px;border-bottom:1px solid var(--line);z-index:1}
.ledger th:nth-child(1),.ledger th:nth-child(2){text-align:left}
.ledger td{padding:6px;text-align:right;color:var(--mut);
  border-bottom:1px solid rgba(35,45,58,.55);white-space:nowrap}
.ledger td:nth-child(1),.ledger td:nth-child(2){text-align:left}
.ledger tr:last-child td{border-bottom:0}
.ledger td.pos{color:var(--accHi)} .ledger td.neg{color:var(--red)}
.ledger td.loss{color:var(--red)}
.ledger tr.tgt td{background:rgba(57,217,138,.12);color:var(--accHi);font-weight:700}
.ledger tr.best td{background:rgba(255,176,32,.12);color:var(--warn);font-weight:700}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.pager button{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card2);
  color:var(--mut);font-family:var(--mono);cursor:pointer}
.pager button:disabled{opacity:.35;cursor:default}
.pager span{font-family:var(--mono);font-size:9px;color:var(--dim)}
.lblRow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.lblRow label{margin:0}
#outHint{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.06em;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.grid.one{grid-template-columns:1fr}
.mk{position:relative;border:1px solid var(--line);background:var(--card2);color:var(--fg);
  border-radius:12px;padding:12px 6px 9px;min-height:64px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;cursor:pointer;font-family:var(--hd);
  touch-action:manipulation;transition:transform .05s ease, border-color .15s ease, background .15s ease}
.mk:active{transform:scale(.96)}
.mk .mv{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.2px;line-height:1.1}
.mk .ma{font-family:var(--mono);font-size:10px;color:var(--mut);font-variant-numeric:tabular-nums}
.mk .mc{position:absolute;top:4px;right:6px;font-family:var(--mono);font-size:8px;color:var(--dim)}
.mk.loss{border-color:rgba(255,92,92,.25);background:rgba(255,92,92,.05)}
.mk.loss .mv{color:var(--red)}
.mk.push .mv{color:var(--blue)}
.mk.win{border-color:rgba(57,217,138,.3);background:rgba(57,217,138,.05)}
.mk.win .mv{color:var(--accHi)}
.mk.hot{box-shadow:inset 0 0 0 1px rgba(255,209,102,.4)}
.mk.hot .mv{color:var(--gold)}
.mk.confirm{min-height:88px;border-color:var(--acc);
  background:linear-gradient(180deg,#10251c,#0f1a16);
  box-shadow:0 0 18px rgba(57,217,138,.18)}
.mk.confirm .mv{font-size:26px}
.mk.confirm .ma{font-size:13px;color:var(--mut)}
.mk.confirm .mc{color:var(--acc);font-size:9px;letter-spacing:.08em}
.empty{font-family:var(--mono);font-size:12px;color:var(--red);line-height:1.7;margin-top:10px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.acts button{padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--mut);font-family:var(--hd);font-weight:700;font-size:13px;cursor:pointer;
  touch-action:manipulation}
.acts button:active{transform:scale(.98)}
.stripLbl{font-family:var(--mono);font-size:9px;font-weight:600;text-transform:uppercase;
  letter-spacing:.12em;color:var(--mut);margin-bottom:6px}
.strip{display:flex;flex-wrap:wrap;gap:5px;min-height:22px;margin-bottom:14px}
.chip{font-family:var(--mono);font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;
  background:var(--card2);border:1px solid var(--line);color:var(--dim)}
.chip.win{color:var(--accHi);border-color:rgba(57,217,138,.3)}
.chip.hot{color:var(--gold);border-color:rgba(255,209,102,.35)}
.chip.loss{color:var(--red);border-color:rgba(255,92,92,.2)}
.hint{font-family:var(--mono);font-size:10px;color:var(--dim)}
.help{font-family:var(--mono);font-size:10px;color:var(--dim);line-height:1.75;
  border-top:1px solid var(--line);padding-top:12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span>LOCK IN<span class="sys">POOL</span></div>
  <span class="sess" id="sessLbl">FULL POOL · 60,000 SEATS</span>
</header>

<div class="card">
  <div class="row">
    <div><label>Game</label><select id="game"></select></div>
    <div><label>Bet</label><select id="bet"></select></div>
  </div>
  <div class="row">
    <div class="wide"><label>Min net profit</label><select id="minprofit"></select></div>
  </div>
</div>

<div class="hero watch" id="hero">
  <div class="hero-n" id="heroN">—</div>
  <div class="hero-l" id="heroL">tap the multiplier you see</div>
  <div class="hero-s" id="heroS"></div>
</div>

<div class="stats">
  <span><b id="stSpins">0</b> <span id="stSpinsL">spins</span></span>
  <span><b id="stCand">60,000</b> <span id="stCandL">seats</span></span>
  <span><b id="stOut">—</b> <span id="stOutL">outcomes</span></span>
</div>

<div class="card" id="rideCard" hidden>
  <label id="rideLabel">Next profitable seat</label>
  <div class="ride-top">
    <div class="ride-net" id="rideNet">—</div>
    <div class="ride-meta" id="rideMeta"></div>
  </div>
  <div class="ride-grid">
    <div class="rg"><span>Cost to reach</span><b id="rideCost">—</b></div>
    <div class="rg"><span>Capital locked</span><b id="rideCap">—</b></div>
    <div class="rg"><span>Win at seat</span><b id="rideWin">—</b></div>
    <div class="rg"><span>Net at seat</span><b id="rideProfit">—</b></div>
  </div>
  <button type="button" class="ledgerBtn" id="ledgerBtn">SHOW PER-SEAT LEDGER</button>
  <div id="ledgerWrap" hidden>
    <div class="ledgerScroller">
      <table class="ledger">
        <thead><tr><th>#</th><th>SEAT</th><th>×</th><th>WIN</th><th>COST</th><th>NET</th></tr></thead>
        <tbody id="ledgerBody"></tbody>
      </table>
    </div>
    <div class="pager">
      <button type="button" id="pgFirst" title="First page">⏮</button>
      <button type="button" id="pgPrev" title="Previous page">◀</button>
      <span id="pgInfo"></span>
      <button type="button" id="pgNext" title="Next page">▶</button>
      <button type="button" id="pgLast" title="Jump to exit">⏭</button>
    </div>
  </div>
</div>

<div class="card">
  <div class="lblRow">
    <label id="outLbl">Possible next outcomes</label>
    <span id="outHint"></span>
  </div>
  <div class="grid" id="outcomes"></div>
  <div class="empty" id="empty" hidden></div>
</div>

<div class="acts">
  <button type="button" id="undo">UNDO</button>
  <button type="button" id="reset">RESET</button>
</div>

<div class="stripLbl">Observed</div>
<div class="strip" id="strip"></div>

<p class="help" id="help"></p>

AAAQAAAAAAAAABAAAAAAAAHQAAAAAAAAAAAgAAAAAAAAAAAAMAAAAAAAAAAgAAAAAAAAAAAAIAAAAAAAAAAAMAAAAAAAAAAAIAAAAAAAAAAAEAAAAAAAAAAgAAAAAAAAAAAgAAAAAAAAAAAAEAAAAAAAAABwAAAAAAAAAABQAAAAAAAAAAAAIAAAAAAAAAFwAAAAAAAAAAAQAAAAAAAAAAAAEAAAAAAAAAAAABAAAAAAAAAAAAAQAAAAAAAQAAAAAAAAAAIwAAAAAAAAAAAQAAAAAAAAAAABEAAAAAAAAAABQAAAAAAAAAAAACAAAAAAAAAAEAAAAAAAAAAAABAAAAAAAAAAEAAAAAAAAAAQAAAAAAAAAAAwAAAAAAAAAAAAIAAAAAAAAAAQAAAAAAAAAABQAAAAAAAAAAAAEAAAAAAAAAAAMAAAAAAAAAAAEAAAAAAAAAAAUAAAAAAAAAAAACAAAAAAAAAAIAAAAAAAAAAgAAAAAAAAAAAgAAAAAAAAAAAAEAAAAAAAAAAAABAAAAAAAAABgAAAAAAAAAAAACAAAAAAAAAgAAAAAAAAAAAQAAAAAAAAAABQAAAAAAAAAAAAEAAAAAAAAAAAUAAAAAAAAAAwAAAAAAAAAABgAAAAAAAAAAAAUAAAAAAAAAAAADAAAAAAAAAAIAAAAAAAAAAAAPAAAAAAAAAAAFAAAAAAAAABAAAAAAAAAABQAAAAAAAAAAAAEAAAAAAAAAAAACAAAAAAAAAAAAAgAAAAAAABAAAAAAAAAAAAABAAAAAAAAAAUAAAAAAAAAAAUAAAAAAAAABQAAAAAAAAAAAgAAAAAAAAAAAAEAAAAAAAAAAAEAAAAAAAAAAQAAAAAAAAAAJAAAAAAAAAAAAA8AAAAAAAAAAAIAAAAAAAAAAAEAAAAAAAAAAgAAAAAAAAAAAAoAAAAAAAAAAAAPAAAAAAAAAAAAAwAAAAAAAAABAAAAAAAAAAAAAQAAAAAAAQAAAAAAAAAAAwAAAAAAAAAAAAEAAAAAAAAAAAEAAAAAAAAAAAABAAAAAAAAAAAWAAAAAAAAAAkAAAAAAAAAAAUAAAAAAAAAFgAAAAAAAAAAAAoAAAAAAAAAAgAAAAAAAAAAACQAAAAAAAAAAAADAAAAAAAAAAABAAAAAAAAAAUAAAAAAAAAAAAFAAAAAAAAAAEAAAAAAAAAAAABAAAAAAAAAAIAAAAAAAAAAAABAAAAAAAAAAACAAAAAAAAAAACAAAAAAAAAQAAAAAAAAAAFQAAAAAAAAAAAQAAAAAAAAAAAAEAAAAAAAAAAAMAAAAAAAAAAAACAAAAAAAAAQAAAAAAAAAADwAAAAAAAAAAAAMAAAAAAAAAAAAFAAAAAAAAAQAAAAAAAAAAAwAAAAAAAAAAAAIAAAAAAAAAAAsAAAAAAAAAIQAAAAAAAAAAAAEAAAAAAAAAABYAAAAAAAAAAAIAAAAAAAAAAAABAAAAAAAAAAABAAAAAAAAAAAAAQAAAAAAAAABAAAAAAAAGAAAAAAAAAAABwAAAAAAAAAAAgAAAAAAAAAAAAEAAAAAAAAAAAALAAAAAAAAAwAAAAAAAAAAAgAAAAAAAAAAAQAAAAAAAAAAAAIAAAAAAAAAABsAAAAAAAAAAAIAAAAAAAAAAAAPAAAAAAAAAAMAAAAAAAAAAAABAAAAAAAAAQAAAAAAAAAAAgAAAAAAAAAAIwAAAAAAAAAAAwAAAAAAAAAAAQAAAAAAAAAAACQAAAAAAAAAAQAAAAAAAAAAAQAAAAAAAAAACgAAAAAAAAAAAC8AAAAAAAAAAAADAAAAAAAAAAABAAAAAAAAAAATAAAAAAAAAAEAAAAAAAAAAQAAAAAAAAAAGAAAAAAAAAAAJgAAAAAAAAAAAAQAAAAAAAAAAAEAAAAAAAAAAAEAAAAAAAAAAAAKAAAAAAAAAgAAAAAAAAAAAwAAAAAAAAAAAgAAAAAAAAAAAAIAAAAAAAAAEwAAAAAAAAAAAgAAAAAAAAAAAQAAAAAAAAAAAAEAAAAAAAAAAQAAAAAAAAAADAAAAAAAAAAAABAAAAAAAAAAAAACAAAAAAAAAAAADQAAAAAAAAADAAAAAAAAABMAAAAAAAAAAAIAAAAAAAAAAAAKAAAAAAAAAgAAAAAAAAAAAAEAAAAAAAAAAQAAAAAAAAAAAAEAAAAAAAAAAAABAAAAAAAAAAUAAAAAAAAAAQAAAAAAAAAAAAMAAAAAAAAAAAABAAAAAAAAAAAAAwAAAAAAABkAAAAAAAAAAAADAAAAAAAAAAABAAAAAAAAAAAAAgAAAAAAAAAFAAAAAAAAAAAABQAAAAAAAAUAAAAAAAAAAAAKAAAAAAAAAAIAAAAAAAAAAAApAAAAAAAAAQAAAAAAAAAAAAoAAAAAAAAAAAEAAAAAAAAABQAAAAAAAAAABQAAAAAAAAAAAAIAAAAAAAAAGgAAAAAAAAAAEgAAAAAAAAAAAwAAAAAAAAAAAAMAAAAAAAAAAwAAAAAAAAAAABEAAAAAAAAAAAABAAAAAAAAAAAIAAAAAAAAAAAAAgAAAAAAAAABAAAAAAAAAAAACgAAAAAAAAAABQAAAAAAAAAAAAMAAAAAAAAAAAAFAAAAACEAAAAAAAAAAAEAAAAAAAAAAQAAAAAAAAAAABgAAAAAAAAAAAACAAAAAAAAAQAAAAAAAAAAHAAAAAAAAAAAAAEAAAAAAAAAAQAAAAAAAAAAAwAAAAAAAAAAAwAAAAAAAAAAAAoAAAAAAAAAAAABAAAAAAAABQAAAAAAAAAAAQAAAAAAAAAAAAMAAAAAAAAAAAAFAAAAAAAAAAMAAAAAAAAAAA4AAAAAAAAAAAAFAAAAAAAAGAAAAAAAAAAAAAEAAAAAAAAAAgAAAAAAAAAAAwAAAAAAAAAAAAQAAAAAAAAAAAEAAAAAAAAAAAIAAAAAAAAAAAABAAAAAAAAAgAAAAAAAAAAAgAAAAAAAAAAAAIAAAAAAAAAAQAAAAAAAAAAAAEAAAAAAAAAAQAAAAAAAAAAAAUAAAAAAAAAAAABAAAAAAAAAAAAAgAAAAAAAAABAAAAAAAACQAAAAAAAAAAAAIAAAAAAAAAAQAAAAAAAAAAAAIAAAAAAAAACgAAAAAAAAAAAQAAAAAAAAAAAAIAAAAAAAAAAAEAAAAAAAAAAA8AAAAAAAAAAQAAAAAAAAAAAA4AAAAAAAAAAAADAAAAAAAAAAoAAAAAAAAAAAAFAAAAAAAAAAUAAAAAAAAAAAEAAAAAAAAAAAABAAAAAAAAAAEAAAAAAAAAAAoAAAAAAAAAFQAAAAAAAAAAAAIAAAAAAAAAAgAAAAAAAAAAAgAAAAAAAAAACgAAAAAAAAAABQAAAAAAAAAAAAEAAAAAAAAAAgAAAAAAAAAAAAMAAAAAAAAAAAIAAAAAAAAAAAABAAAAAAAAAAACAAAAAAAAAAkAAAAAAAAAAAEAAAAAAAAAAAEAAAAAAAAAAAADAAAAAAAAAAoAAAAAAAAAAwAAAAAAAAAABQAAAAAAAAAAAAIAAAAAAAAAAAABAAAAAAAAAAACAAAAAAAAAAEAAAAAAAAAAQAAAAAAAAAAAQAAAAAAAAAAAQAAAAAAAAAADwAAAAAAAAAAAgAAAAAAAAAAAAMAAAAAAAAAAAAlAAAAAAAAAAAAIQAAAAAAACQAAAAAAAAAAAACAAAAAAAAAAAAAwAAAAAAAAEAAAAAAAAAAAIAAAAAAAAAAAABAAAAAAAAAAEAAAAAAAAAAAACAAAAAAAAAAABAAAAAAAAAAAAAQAAAAAAAgAAAAAAAAAAAQAAAAAAAAAAAAsAAAAAAAAAAAgAAAAAAAAAAAACAAAAAAAAAAABAAAAAAAAAAMAAAAAAAAACgAAAAAAAAAAAQAAAAAAAAAAAAUAAAAAAAAAAAABAAAAAAAAAAAAAwAAAAAAKwAAAAAAAAAAEAAAAAAAAAAAAAQAAAAAAAAAAAMAAAAAAAAACgAAAAAAAAAAAAMAAAAAAAAAHQAAAAAAAAAAAAEAAAAAAAAAAEsAAAAAAAAAAAUAAAAAAAAAAAABAAAAAAAAAAAAAQAAAAAAAgAAAAAAAAAAAwAAAAAAAAAAAAoAAAAAAAAAAAoAAAAAAAAAAAIAAAAAAAAAAAABAAAAAAAAAAAFAAAAAAAAAAAWAAAAAAAAAAABAAAAAAAAAAAFAAAAAAAAAAAABQAAAAAAAQAAAAAAAAAAAAEAAAAAAAAAAAIAAAAAAAAAAQAAAAAAAAAAAgAAAAAAAAAAAA8AAAAAAAAAAAMAAAAAAAAAAAEAAAAAAAAAAwAAAAAAAAAAAQAAAAAAAAAAAgAAAAAAAAAAIgAAAAAAAAAAAQAAAAAAAAAAAAUAAAAAAAAAAAEAAAAAAAAAAAEAAAAAAAAAAAEAAAAAAAAAAAYAAAAAAAAAEAAAAAAAAAAAAQAAAAAAAAAAAQAAAAAAAAAAJwAAAAAAAAAAABUAAAAAAAAAABkAAAAAAAAAAAACAAAAAAAAAAEAAAAAAAAAAAEAAAAAAAAAAAACAAAAAAAAAAAAAQAAAAAAAgAAAAAAAAAABQAAAAAAAAAAAAUAAAAAAAAAAQAAAAAAAAAABQAAAAAAAAAAAAgAAAAAAAAAAAMAAAAAAAAAAAABAAAAAAAAAAAAGwAAAAAAAAAAAAIAAAAAAAACAAAAAAAAAAIAAAAAAAAAAAIAAAAAAAAAAAMAAAAAAAAAAAEAAAAAAAAAAAABAAAAAAAAAgAAAAAAAAAAAAQAAAAAAAAABQAAAAAAAAAABQAAAAAAAAAAADQAAAAAAAAAAAABAAAAAAAAAAADAAAAAAAAAAABAAAAAAAAAAIAAAAAAAAAAAMAAAAAAAAAAQAAAAAAAAAAAgAAAAAAAAAAAwAAAAAAAAAABQAAAAAAAAAAAQAAAAAAAAAADwAAAAAAAAAAABEAAAAAAAAAAAEAAAAAAAAACgAAAAAAAAAAAAEAAAAAAAAAAAEAAAAAAAAAAAARAAAAAAAAAAABAAAAAAAAAAAABQAAAAAAAgAAAAAAAAAAAAEAAAAAAAAAADAAAAAAAAAAAwAAAAAAAAAAAAMAAAAAAAAAAAEAAAAAAAAAAAEAAAAAAAAAAA8AAAAAAAAAAAAKAAAAAAAAAAABAAAAAAAAAAIAAAAAAAAABQAAAAAAAAAAAAIAAAAAAAAAAAABAAAAAAAAAAABAAAAAAAABQAAAAAAAAAAAAMAAAAAAAAABQAAAAAAAAAAAAEAAAAAAAAAAQAAAAAAAAAAAQAAAAAAAAAAKwAAAAAAAAAAAAUAAAAAAAAAAAADAAAAAAAAAAIAAAAAAAAAABAAAAAAAAAAAwAAAAAAAAAAAAIAAAAAAAAAAAACAAAAAAAAAAIAAAAAAAAAAAIAAAAAAAAAAAAWAAAAAAAAFAAAAAAAAAAABwAAAAAAAAAAAAUAAAAAAAAAAAABAAAAAAAAAAAADwAAAAAAAAIAAAAAAAAAAAIAAAAAAAAAAAACAAAAAAAAAAABAAAAAAAAAAAAAgAAAAAAAAoAAAAAAAAAAAIAAAAAAAAAAAACAAAAAAAAAAUAAAAAAAAAAAACAAAAAAAAAAANAAAAAAAAAQAAAAAAAAAAAAEAAAAAAAAADwAAAAAAAAAAAB8AAAAAAAAAAQAAAAAAAAAAAAIAAAAAAAAAAwAAAAAAAAAAAAIAAAAAAAAAAAACAAAAAAAAAAAAAQAAAAAAAAAAAAEAAAAAAAAAAQAAAAAAAAUAAAAAAAAAAAABAAAAAAAAAAAAAQAAAAAAAQAAAAAAAAAAABIAAAAAAAAAAAEAAAAAAAAAAQAAAAAAAAAADQAAAAAAAAAAAAMAAAAAAAAAAAAKAAAAAAAAAAAXAAAAAAAAABUAAAAAAAAAAAABAAAAAAAAAAAAKAAAAAAABQAAAAAAAAAAAgAAAAAAAAAAAAEAAAAAAAAAAAkAAAAAAAAAAAABAAAAAAAABQAAAAAAAAAABQAAAAAAAAAAABQAAAAAAAAAIQAAAAAAAAAABgAAAAAAAAAACgAAAAAAAAAAAQAAAAAAAAAAAQAAAAAAAAAAAwAAAAAAAAAAAAEAAAAAAAAABQAAAAAAAAAAABkAAAAAAAAAAAABAAAAAAAAAAAAAgAAAAAAAAEAAAAAAAAAAQAAAAAAAAAAABIAAAAAAAAAACEAAAAAAAAAAAEAAAAAAAAACgAAAAAAAAAAAgAAAAAAAAAAACgAAAAAAAAAACIAAAAAAAAAAAAFAAAAAAAAAAAAAQAAAAAAAAAAAQAAAAAAAAABAAAAAAAAAAEAAAAAAAAAAQAAAAAAAAAAAQAAAAAAAAAAAQAAAAAAAAAABQAAAAAAAAAAAAEAAAAAAAAAAAEAAAAAAAAAAAIAAAAAAAAAAQAAAAAAAAAAAQAAAAAAAAAAAQAAAAAAAAAAAQAAAAAAAAAAAAIAAAAAAAAAAAEAAAAAAAAAAB0AAAAAAAAAAAEAAAAAAAAAAB4AAAAAAAAAAAEAAAAAAAAAAAACAAAAAAAAAAAAAgAAAAAAAAAKAAAAAAAAAAACAAAAAAAAAAIAAAAAAAAAAQAAAAAAAAAAAgAAAAAAAAAAAwAAAAAAAAAAAwAAAAAAAAAAAAEAAAAAAAAAAAABAAAAAAAAAAUAAAAAAAAAAAASAAAAAAAAAQAAAAAAAAAAAAEAAAAAAAAAAAADAAAAAAAAAQAAAAAAAAAAAQAAAAAAAAAAAwAAAAAAAAAAAAEAAAAAAAAAAAAYAAAAAAAACgAAAAAAAAAAAgAAAAAAAAAAAQAAAAAAAAAAQgAAAAAAAAAAAAoAAAAAAAAAAAEAAAAAAAAAAAEAAAAAAAAAAQAAAAAAAAAADQAAAAAAAAAAAQAAAAAAAAAAAAIAAAAAAAAAAAUAAAAAAAAAAAcAAAAAAAAAAQAAAAAAAAAAAgAAAAAAAAAACAAAAAAAAAAADQAAAAAAAAAAAAEAAAAAAAAAAAAFAAAAAAAAAAADAAAAAAAAAQAAAAAAAAAAAA4AAAAAAAAAAAAFAAAAAAAAAAAABQAAAAAAAAABAAAAAAAAAAMAAAAAAAAAAAIAAAAAAAAAAAABAAAAAAAAAgAAAAAAAAAAAAEAAAAAAAAAAAABAAAAAAAAAAADAAAAAAAAAAABAAAAAAAAAAAABQAAAAAAAAAAAQAAAAAAAgAAAAAAAAAAAAIAAAAAAAAAAAEAAAAAAAAAAAAYAAAAAAAACQAAAAAAAAAAAAMAAAAAAAAAGwAAAAAAAAAAAAMAAAAAAAAAAAEAAAAAAAAAAQAAAAAAAAAAAAEAAAAAAAAAAAADAAAAAAAAAAEAAAAAAAAAAgAAAAAAAAAABQAAAAAAAAAAAAEAAAAAAAAAAAIAAAAAAAAAAAEAAAAAAAAAAA0AAAAAAAAAAAABAAAAAAAAAAABAAAAAAAAAQAAAAAAAAAAAAEAAAAAAAAAAAsAAAAAAAAAAAEAAAAAAAAAAAUAAAAAAAAABQAAAAAAAAAAAAMAAAAAAAAAAAIAAAAAAAAAAAACAAAAAAAAAAAoAAAAAAAAAAAAAQAAAAAAAAAAJwAAAAAAAAEAAAAAAAAAHwAAAAAAAAAAAwAAAAAAAAAAAQAAAAAAAAAAAQAAAAAAAAAAAwAAAAAAAAAAAAUAAAAAAAAAAAACAAAAAAAAAQAAAAAAAAAAAAEAAAAAAAAAAAEAAAAAAAAAAAEAAAAAAAAAAAEAAAAAAAAAAQAAAAAAAAAAJQAAAAAAAAAAAgAAAAAAAAAAAQAAAAAAAAAAAAUAAAAAAAAAAAAFAAAAAAAAAAoAAAAAAAAAAAEAAAAAAAAAAQAAAAAAAAAAAQAAAAAAAAAAAAoAAAAAAAAAAgAAAAAAAAAAAAMAAAAAAAAAAgAAAAAAAAAAAAMAAAAAAAAAAAEAAAAAAAAAHgAAAAAAAAAAAAEAAAAAAAAAAAABAAAAAAAAKgAAAAAAAAAAAQAAAAAAAAAAACYAAAAAAAAAAQAAAAAAAAAAAAIAAAAAAAAAAAACAAAAAAAAAAAAAgAAAAAAAQAAAAAAAAAAAgAAAAAAAAAAAAUAAAAAAAAAAAUAAAAAAAAAAAAcAAAAAAAACgAAAAAAAAAAAQAAAAAAAAAAAAEAAAAAAAAAAAEAAAAAAAAAAQAAAAAAAAAAAAEAAAAAAAAAABkAAAAAAAAAAAoAAAAAAAAAAAEAAAAAAAAAAAIAAAAAAAAAAAAFAAAAAAAAAAEAAAAAAAAAAAABAAAAAAAAAAAKAAAAAAAAAAABAAAAAAAAADAAAAAAAAAAAQAAAAAAAAAAAAIAAAAAAAAAAAAFAAAAAAAAAAAAAQAAAAAABwAAAAAAAAAAAgAAAAAAAAAAAwAAAAAAAAAAAAEAAAAAAAAAAwAAAAAAAAAAAgAAAAAAAAAAAQAAAAAAAAAAAAEAAAAAAAAAAAAKAAAAAAAAKQAAAAAAAAAAAAUAAAAAAAAAAAABAAAAAAAAAAAAAQAAAAAAAAAAAAUAAAAAAAAAAAABAAAAAAAPAAAAAAAAAAABAAAAAAAAAAAFAAAAAAAAAgAAAAAAAAAAAAoAAAAAAAAAAAAKAAAAAAAAAAAAAQAAAAAAAAAAAQAAAAAAAAAAAQAAAAAAAAASAAAAAAAAAAAAAQAAAAAAAAAAAAwAAAAAAAEAAAAAAAAAAAAKAAAAAAAAAAAACgAAAAAAAAUAAAAAAAAAAAAKAAAAAAAAAQAAAAAAAAAAAQAAAAAAAAAAAAUAAAAAAAAAAAADAAAAAAAAJAAAAAAAAAAAAAEAAAAAAAAAAAIAAAAAAAAAAAMAAAAAAAAAAAACAAAAAAAAAAAUAAAAAAAAAAAACgAAAAAAAAMAAAAAAAAAAAIAAAAAAAAAAAoAAAAAAAAAAAABAAAAAAAAAAABAAAAAAAAAAEAAAAAAAAAAwAAAAAAAAAAAAMAAAAAAAAAGgAAAAAAAAAACgAAAAAAAAAAAB4AAAAAAAAAAwAAAAAAAAAADAAAAAAAAAAAAQAAAAAAAAAAAAIAAAAAAAAAAgAAAAAAAAAACgAAAAAAAAAAAAIAAAAAAAAAAAEAAAAAAAAABQAAAAAAAAAAAgAAAAAAAAAAAAEAAAAAAAAACwAAAAAAAAAAAAkAAAAAAAAAAAEAAAAAAAAAAAEAAAAAAAAAAAoAAAAAAAAAAAA+AAAAAAAAAwAAAAAAAAAAAwAAAAAAAAAAAQAAAAAAAAAAAwAAAAAAAAAAAAEAAAAAAAAAAgAAAAAAAAAAAAMAAAAAAAAAAAoAAAAAAAAAAAADAAAAAAAAAAAAJwAAAAAAAAAAAAIAAAAAAAAAAAIAAAAAAAAAAAMAAAAAAAAAAAEAAAAAAAAAAAMAAAAAAAACAAAAAAAAAAACAAAAAAAAAAAAAQAAAAAAAAoAAAAAAAAABQAAAAAAAAAAAAIAAAAAAAAAAwAAAAAAAAAAAAIAAAAAAAAAEQAAAAAAAAAACgAAAAAAAAAAAQAAAAAAAAAAAgAAAAAAAAAAAAIAAAAAAAAAAAAFAAAAAAAAAAAFAAAAAAAAAAAALQAAAAAAAAMAAAAAAAAAAgAAAAAAAAAADQAAAAAAAAAAAAkAAAAAAAAABQAAAAAAAAAAADIAAAAAAAAAAAIAAAAAAAAAAAEAAAAAAAAAAQAAAAAAAAAAAAwAAAAAAAAAEwAAAAAAAAAABQAAAAAAAAAADAAAAAAAAAAAAQAAAAAAAAAAAQAAAAAAAAAAAwAAAAAAAAAAAAEAAAAAAAAAAQAAAAAAAAAAAwAAAAAA"}}};
const $ = s => document.querySelector(s);
const NROWS = DATA.nrows;
const GAMEKEYS = Object.keys(DATA.games);
const BETS = [25,50,75,100,150,200,250,300,400,500];
const MINPROFITS = [
  {v:0, label:"Any profit (> $0.00)"},
  {v:100, label:"≥ $1.00"},
  {v:500, label:"≥ $5.00"},
  {v:1000, label:"≥ $10.00"},
  {v:2500, label:"≥ $25.00"},
  {v:5000, label:"≥ $50.00"},
  {v:10000, label:"≥ $100.00"}
];

const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

const wrap = i => ((i % NROWS) + NROWS)%NROWS;
const money = c => "$" + (c/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const smoney = c => (c<0?"-":"+") + money(Math.abs(c));
const nmoney = c => c === 0 ? money(0) : smoney(c);
const fmtMult = v => "×" + (v%100===0 ? (v/100) : (v/100).toFixed(2));
const fmt = n => n.toLocaleString("en-US");
const compact = n => n>=10000 ? (n>=100000 ? Math.round(n/1000) : (n/1000).toFixed(1)) + "k" : fmt(n);

let pal = null, bytes = null, gameKey = null;
let betCents = 250, minProfitCents = 0;
let ledgerOpen = false, ledgerPage = 0;
let seq = [], cand = null;

const poolAt = i => pal[bytes[wrap(i)]];

function decode(b64){
  const bin = atob(b64);
  const a = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i] = bin.charCodeAt(i);
  return a;
}
function allCand(){
  const s = new Set();
  for(let i=0;i<NROWS;i++) s.add(i);
  return s;
}
function sessKey(){ return "lockin0_" + gameKey + "_" + betCents; }

function setGame(k){
  gameKey = k;
  const g = DATA.games[k];
  pal = g.palette;
  bytes = decode(g.idx);
  loadSession();
}

function loadSession(){
  seq = [];
  ledgerPage = 0;
  try{
    const raw = store.get(sessKey());
    if(raw) seq = JSON.parse(raw);
  }catch(e){ seq = []; }
  if(!Array.isArray(seq)) seq = [];
  seq = seq.filter(x => Number.isFinite(x) && x >= 0).map(x => Math.round(x));
  refilter();
  render();
}

function refilter(){
  cand = allCand();
  for(let t=0; t<seq.length && cand.size; t++){
    const want = seq[t];
    const keep = new Set();
    for(const c of cand) if(poolAt(c+t) === want) keep.add(c);
    cand = keep;
  }
}

function persist(){ store.set(sessKey(), JSON.stringify(seq)); }

function feed(v){
  seq.push(v);
  ledgerPage = 0;
  const t = seq.length - 1;
  const keep = new Set();
  for(const c of cand) if(poolAt(c+t) === v) keep.add(c);
  cand = keep;
  persist();
  render();
}

function undo(){
  if(!seq.length) return;
  ledgerPage = 0;
  seq.pop();
  refilter();
  persist();
  render();
}

function reset(){
  if(!seq.length) return;
  if(!confirm("Clear this session?")) return;
  seq = [];
  ledgerPage = 0;
  refilter();
  store.del(sessKey());
  render();
}

function buildRide(base, minProfit){
  let cum = 0, worst = 0, best = -Infinity, bestK = 0, bestV = 0, bestWorst = 0;
  for(let k=0; k<NROWS; k++){
    const v = poolAt(base + k);
    cum += Math.round(v * betCents / 100) - betCents;
    if(cum < worst) worst = cum;
    if(cum > best){ best = cum; bestK = k; bestV = v; bestWorst = worst; }
    if(cum > 0 && cum >= minProfit){
      return {ok:true, k:k, seat:wrap(base+k), v:v, win:Math.round(v*betCents/100),
        net:cum, worst:worst, wagered:(k+1)*betCents};
    }
  }
  return {ok:false, k:bestK, seat:wrap(base+bestK), v:bestV,
    win:Math.round(bestV*betCents/100), net:best, worst:bestWorst,
    wagered:(bestK+1)*betCents};
}

function renderLedger(base, total, targetClass){
  const wrapEl = $("#ledgerWrap");
  if(!ledgerOpen){ wrapEl.hidden = true; return; }
  wrapEl.hidden = false;
  const PAGE = 50;
  const pages = Math.max(1, Math.ceil(total / PAGE));
  ledgerPage = Math.max(0, Math.min(ledgerPage, pages - 1));
  const start = ledgerPage * PAGE, end = Math.min(start + PAGE, total);

  let cum = 0, wagered = 0;
  const rows = [];
  for(let k=0; k<end; k++){
    const v = poolAt(base + k);
    const win = Math.round(v * betCents / 100);
    cum += win - betCents;
    wagered += betCents;
    if(k >= start) rows.push({i:k+1, seat:wrap(base+k), v:v, win:win, cost:wagered, net:cum});
  }

  const tb = $("#ledgerBody");
  tb.innerHTML = "";
  for(const r of rows){
    const tr = document.createElement("tr");
    if(r.i === total) tr.className = targetClass;
    const ncls = r.i === total ? "" : (r.net > 0 ? "pos" : r.net < 0 ? "neg" : "");
    tr.innerHTML = "<td>" + r.i + "</td>" +
      "<td>" + fmt(r.seat) + "</td>" +
      "<td class='" + (r.v === 0 ? "loss" : "") + "'>" + (r.v === 0 ? "LOSS" : fmtMult(r.v)) + "</td>" +
      "<td>" + money(r.win) + "</td>" +
      "<td>" + money(r.cost) + "</td>" +
      "<td class='" + ncls + "'>" + nmoney(r.net) + "</td>";
    tb.appendChild(tr);
  }

  $("#pgInfo").textContent = fmt(start + 1) + "–" + fmt(end) + " of " + fmt(total);
  $("#pgFirst").disabled = $("#pgPrev").disabled = ledgerPage === 0;
  $("#pgLast").disabled = $("#pgNext").disabled = ledgerPage >= pages - 1;
}

function renderRide(base, ride){
  const card = $("#rideCard");
  card.hidden = false;
  card.classList.toggle("bad", !ride.ok);

  const spins = ride.k + 1;
  $("#rideNet").textContent = nmoney(ride.net);
  $("#rideNet").className = "ride-net " + (ride.net > 0 ? "pos" : ride.net < 0 ? "neg" : "flat");
  $("#rideCost").textContent = money(ride.wagered);
  $("#rideCap").textContent = money(Math.max(0, -ride.worst));
  $("#rideWin").textContent = money(ride.win);
  $("#rideProfit").textContent = nmoney(ride.net);
  $("#rideProfit").className = ride.net > 0 ? "pos" : ride.net < 0 ? "neg" : "";

  if(ride.ok){
    $("#rideLabel").textContent = "Next profitable seat";
    $("#rideMeta").innerHTML = "seat <b>" + fmt(ride.seat) + "</b><br>" +
      fmt(spins) + " spin" + (spins === 1 ? "" : "s") + " · exit " + fmtMult(ride.v);
    $("#ledgerBtn").textContent = (ledgerOpen ? "HIDE" : "SHOW") +
      " PER-SEAT LEDGER (" + fmt(spins) + ")";
    renderLedger(base, spins, "tgt");
  }else{
    $("#rideLabel").textContent = minProfitCents > 0
      ? "No seat reaches " + money(minProfitCents) + " in a full cycle"
      : "No profitable seat in a full cycle";
    $("#rideMeta").innerHTML = "best seat <b>" + fmt(ride.seat) + "</b><br>" +
      fmt(spins) + " spin" + (spins === 1 ? "" : "s") + " · best exit";
    $("#ledgerBtn").textContent = (ledgerOpen ? "HIDE" : "SHOW") +
      " BEST-EXIT LEDGER (" + fmt(spins) + ")";
    renderLedger(base, spins, "best");
  }
}

function render(){
  const n = seq.length, size = cand.size;
  const dead = size === 0, locked = size === 1;

  let counts = null, base = null, nextV = 0;
  if(!dead){
    counts = new Map();
    for(const c of cand){
      const v = poolAt(c + n);
      counts.set(v, (counts.get(v) || 0) + 1);
    }
    if(locked){
      base = wrap([...cand][0] + n);
      nextV = poolAt(base);
    }
  }

  const hero = $("#hero");
  hero.className = "hero " + (dead ? "bad" : locked ? "lock" : "watch");
  if(dead){
    $("#heroN").textContent = "NO MATCH";
    $("#heroL").textContent = "undo one spin, or reset";
    $("#heroS").textContent = "wrong game/bet, a missed spin, or an untracked free round";
  }else if(locked){
    $("#heroN").textContent = "LOCKED";
    $("#heroL").textContent = "seat " + fmt(base) + " · next " +
      (nextV ? fmtMult(nextV) : "LOSS") + (nextV ? " = " + money(nextV * betCents / 100) : "");
    $("#heroS").textContent = n + " spins recorded · tap the outcome after each spin to advance";
  }else{
    $("#heroN").textContent = fmt(size);
    $("#heroL").textContent = "possible seats";
    $("#heroS").textContent = n
      ? n + " spins recorded · tap the multiplier you saw"
      : "tap the multiplier shown on the machine";
  }

  $("#stSpins").textContent = fmt(n);
  $("#stCand").textContent = fmt(size);
  $("#stOut").textContent = counts ? fmt(counts.size) : "0";
  $("#stSpinsL").textContent = n === 1 ? "spin" : "spins";
  $("#stCandL").textContent = size === 1 ? "seat" : "seats";
  $("#stOutL").textContent = (counts ? counts.size : 0) === 1 ? "outcome" : "outcomes";

  if(locked){
    renderRide(base, buildRide(base, minProfitCents));
  }else{
    $("#rideCard").hidden = true;
    $("#ledgerWrap").hidden = true;
  }

  const out = $("#outcomes"), empty = $("#empty");
  out.innerHTML = "";
  out.className = "grid" + (locked ? " one" : "");
  if(dead){
    out.hidden = true;
    empty.hidden = false;
    empty.textContent = "No possible outcome — the recorded sequence does not occur anywhere in this pool.";
    $("#outLbl").textContent = "Possible next outcomes";
    $("#outHint").textContent = "";
  }else{
    out.hidden = false;
    empty.hidden = true;
    $("#outLbl").textContent = locked ? "Confirmed next outcome" : "Possible next outcomes";
    $("#outHint").textContent = locked ? "tap after the spin" : fmt(counts.size) + " distinct";
    const vals = [...counts.keys()].sort((a,b) => a-b);
    for(const v of vals){
      const b = document.createElement("button");
      b.type = "button";
      b.className = "mk " + (v === 0 ? "loss" : v === 100 ? "push" : "win") +
        (v >= 500 ? " hot" : "") + (locked ? " confirm" : "");
      b.onclick = () => feed(v);
      b.title = counts.get(v) + " possible seat" + (counts.get(v) === 1 ? "" : "s");

      const mv = document.createElement("span");
      mv.className = "mv";
      mv.textContent = v === 0 ? "LOSS" : fmtMult(v);

      const ma = document.createElement("span");
      ma.className = "ma";
      ma.textContent = v === 0 ? "$0.00" : money(v * betCents / 100);

      const mc = document.createElement("span");
      mc.className = "mc";
      mc.textContent = locked ? "TAP" : compact(counts.get(v));

      b.append(mv, ma, mc);
      out.appendChild(b);
    }
  }

  const strip = $("#strip");
  strip.innerHTML = "";
  if(!seq.length){
    const z = document.createElement("span");
    z.className = "hint";
    z.textContent = "nothing recorded yet";
    strip.appendChild(z);
  }else{
    seq.slice(-40).forEach(v => {
      const s = document.createElement("span");
      s.className = "chip " + (v === 0 ? "loss" : v >= 500 ? "hot" : "win");
      s.textContent = v === 0 ? "0" : fmtMult(v);
      strip.appendChild(s);
    });
  }
}

(function boot(){
  const g = $("#game");
  GAMEKEYS.forEach(k => {
    const o = document.createElement("option");
    o.value = k;
    o.textContent = DATA.games[k].label;
    g.appendChild(o);
  });

  const b = $("#bet");
  BETS.forEach(v => {
    const o = document.createElement("option");
    o.value = v;
    o.textContent = "$" + (v/100).toFixed(2);
    b.appendChild(o);
  });

  const mp = $("#minprofit");
  MINPROFITS.forEach(t => {
    const o = document.createElement("option");
    o.value = t.v;
    o.textContent = t.label;
    mp.appendChild(o);
  });

  gameKey = store.get("lockin_game");
  if(!DATA.games[gameKey]) gameKey = GAMEKEYS[0];

  const savedBet = +(store.get("lockin_bet") || 250);
  if(BETS.indexOf(savedBet) >= 0) betCents = savedBet;

  const savedMin = +(store.get("lockin0_minprofit") || 0);
  if(MINPROFITS.some(t => t.v === savedMin)) minProfitCents = savedMin;

  g.value = gameKey;
  b.value = betCents;
  mp.value = minProfitCents;

  g.onchange = () => { store.set("lockin_game", g.value); setGame(g.value); };
  b.onchange = () => { betCents = +b.value; store.set("lockin_bet", String(betCents)); loadSession(); };
  mp.onchange = () => { minProfitCents = +mp.value; store.set("lockin0_minprofit", String(minProfitCents)); ledgerPage = 0; render(); };
  $("#undo").onclick = undo;
  $("#reset").onclick = reset;
  $("#ledgerBtn").onclick = () => { ledgerOpen = !ledgerOpen; render(); };
  $("#pgPrev").onclick = () => { if(ledgerPage > 0){ ledgerPage--; render(); } };
  $("#pgNext").onclick = () => { ledgerPage++; render(); };
  $("#pgFirst").onclick = () => { ledgerPage = 0; render(); };
  $("#pgLast").onclick = () => { ledgerPage = 1e9; render(); };

  $("#help").textContent = "Every spin is tested against the full 60,000-row pool — all 0–59,999 seats, " +
    "wrapping 59,999 → 0. No current index or cursor guess is used: each entry is checked against " +
    "the whole pool from scratch, removing the seats that could not be there until one seat locks. " +
    "Keep one game and one bet for the whole session and enter every spin in order (losses included; " +
    "free spins run on the $0.25 session). Only outcomes still possible are shown — if the machine shows " +
    "one that is missing, a spin was missed: UNDO or RESET. Once locked, the ride card finds the next " +
    "seat where cumulative wins beat every stake: it shows the total cost to get there, the worst " +
    "drawdown (capital locked), the win at that seat, and a per-seat ledger of win, cumulative cost and " +
    "running net. Min net profit lets you skip rides that only break even.";

  setGame(gameKey);
})();
</script>
</body>
