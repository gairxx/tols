<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Win Tracker</title>
<script>
/* Access guard: the site is entered through the calculator gate on the hub page.
   Keeps the tools out of casual view for anyone who guesses this file's URL.
   It is browser-side obfuscation, not authentication -- anyone can read this
   file. Opened straight off disk (file://) the guard stands down so the app
   keeps working as a self-contained offline page. */
(function(){
  try {
    if (location.protocol === "file:") return;
    var KEY = "dsfus4_unlock";
    var exp = Number(localStorage.getItem(KEY));
    if (Number.isFinite(exp) && exp > Date.now()) return;
    // Drop the filename, then the apps/ segment. Two separate steps so this also
    // works on a project Pages site, where the app sits under a subpath.
    var root = location.pathname.replace(/\/[^/]*$/, "").replace(/\/[^/]*$/, "");
    location.replace(root + "/index.html?locked=1");
  } catch (e) { /* never block the app on a guard failure */ }
})();
</script>
<style>
:root{
  --c0:#0b0f14; --c1:#10141b; --c2:#141a23; --c3:#1a212c; --bg-lo:#0d1118;
  --fg:#e8eef7; --mut:#8ba0b8; --dim:#5b6b7c; --line:#232d3a;
  --acc:#39d98a; --acc-hi:#5df6a4; --warn-t:#ffb020; --red-t:#ff5c5c; --blue-t:#9dcaff;
  --hd:'Space Grotesk',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--c0);color:var(--fg);font-family:var(--hd);max-width:430px;margin:0 auto;
  padding:12px 14px 40px;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.02em}
.dot{width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc)}
.sys{font-family:var(--mono);font-size:9px;color:var(--acc);letter-spacing:.12em;
  border:1px solid rgba(57,217,138,.4);padding:2px 6px;border-radius:5px}
.card{background:var(--c1);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
label{display:block;font-family:var(--mono);font-size:10px;font-weight:600;text-transform:uppercase;
  letter-spacing:.12em;color:var(--mut);margin:0 0 8px}
select{width:100%;padding:11px 10px;font-family:var(--mono);font-size:14px;font-weight:600;
  color:var(--fg);background:var(--bg-lo);border:1px solid var(--line);border-radius:10px;appearance:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;border:1px solid var(--line);
  border-radius:12px;background:var(--bg-lo)}
.seg button{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.05em;padding:9px;
  border-radius:8px;border:1px solid transparent;background:transparent;color:var(--mut)}
.seg button.on{background:var(--c3);color:var(--acc-hi);border-color:rgba(57,217,138,.45)}
.big{text-align:center;padding:24px 14px;border-radius:16px;border:1px solid var(--line);
  background:radial-gradient(130% 150% at 50% -20%,#16324a 0%,#121c26 60%,#101419 100%)}
.big .n{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.big .l{font-family:var(--mono);font-size:10px;color:var(--mut);text-transform:uppercase;
  letter-spacing:.16em;margin-top:6px}
.big.locked{background:radial-gradient(130% 150% at 50% -20%,#0f402a 0%,#0a2a1b 55%,#0c2318 100%);
  border-color:var(--acc)}
.big.locked .n{color:var(--acc-hi)}
.big.locked .l{color:var(--acc)}
.stats{font-family:var(--mono);font-size:11px;color:var(--dim);display:flex;gap:14px;
  justify-content:center;margin:-4px 0 10px}
.stats b{color:var(--fg);font-weight:600}
.wl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
button{font-family:var(--hd);font-weight:700;border-radius:14px;border:1px solid var(--line);
  padding:18px;font-size:16px;letter-spacing:.04em;background:var(--c2);color:var(--fg);cursor:pointer}
button.win{background:linear-gradient(180deg,#0f402a,#0a2a1b);border-color:var(--acc);color:var(--acc-hi)}
button.loss{background:linear-gradient(180deg,#3a1416,#241014);border-color:var(--red-t);color:var(--red-t)}
button.undo{grid-column:1/-1;padding:12px;font-size:13px;background:var(--c1);color:var(--mut)}
.entry{border:1px solid var(--line);background:var(--c1);border-radius:14px;padding:12px 14px;
  margin-bottom:10px;display:flex;align-items:baseline;justify-content:space-between}
.entry .e{font-family:var(--hd);font-size:26px;font-weight:800;color:var(--fg);font-variant-numeric:tabular-nums}
.entry .h{font-family:var(--mono);font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{padding:14px;font-size:15px;border-radius:12px}
.pad button.act{grid-column:span 2;background:linear-gradient(180deg,#0f402a,#0a2a1b);border-color:var(--acc);color:var(--acc-hi)}
.pad button.loss{background:linear-gradient(180deg,#3a1416,#241014);border-color:var(--red-t);color:var(--red-t)}
.pad button.del{background:var(--c1);color:var(--mut)}
.ctrls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ctrls button{padding:12px;font-size:13px;background:var(--c1);color:var(--mut)}
#amtHint{font-family:var(--mono);font-size:11px;color:var(--warn-t);line-height:1.6;margin-top:10px}
.info{font-family:var(--mono);font-size:12px;color:var(--mut);line-height:1.7}
.info b{color:var(--fg)}
.info .ok{color:var(--acc-hi)}
.info .bad{color:var(--red-t)}
.info .hl{color:var(--warn-t)}
.strip{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.chip{font-family:var(--mono);font-size:10px;font-weight:600;padding:4px 8px;border-radius:6px;
  background:var(--c2);border:1px solid var(--line);color:var(--dim)}
.chip.win{color:var(--acc-hi);border-color:rgba(57,217,138,.35);background:rgba(57,217,138,.08)}
.chip.loss{color:var(--red-t);border-color:rgba(255,92,92,.25);background:rgba(255,92,92,.06)}
.howto{font-family:var(--mono);font-size:11px;color:var(--dim);line-height:1.7;margin-bottom:12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span>Win Tracker<span class="sys">CURSOR</span></div>
</header>

<div class="card">
  <label>Game</label>
  <select id="game"></select>
  <div class="seg" style="margin-top:10px">
    <button data-mode="wl" class="on">WIN / LOSS</button>
    <button data-mode="amt">AMOUNTS</button>
  </div>
</div>

<div class="card" id="betCard" hidden>
  <label>Wager per spin (for $ → amount)</label>
  <select id="bet"></select>
</div>

<div class="big" id="big">
  <div class="n" id="bigN">—</div>
  <div class="l" id="bigL">tap a result each spin</div>
</div>

<div class="stats">
  <span><b id="stTotal">0</b> spins</span>
  <span><b id="stWins">0</b> win</span>
  <span><b id="stLosses">0</b> loss</span>
  <span>streak <b id="stStreak">0</b></span>
</div>

<!-- win/loss mode -->
<div class="wl" id="wlBtns">
  <button class="win" id="winBtn">WIN</button>
  <button class="loss" id="lossBtn">LOSS</button>
  <button class="undo" id="undoBtn1">UNDO</button>
  <button class="undo" id="resetBtn1">RESET</button>
</div>

<!-- amounts mode -->
<div id="amtArea" hidden>
  <div class="entry">
    <span class="e" id="entryVal">0.00</span>
    <span class="h">win $</span>
  </div>
  <div class="pad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k=".">.</button><button data-k="0">0</button><button class="del" data-k="del">DEL</button>
    <button class="act" data-k="add">ADD</button>
    <button class="loss" data-k="loss">LOSS (0.00)</button>
  </div>
  <div class="ctrls">
    <button id="undoBtn2">UNDO</button>
    <button id="resetBtn2">RESET</button>
  </div>
  <div id="amtHint" hidden></div>
</div>

<div class="howto" id="howto"></div>

<div class="info card" id="info">Pick a game to start.</div>

<div class="strip" id="strip"></div>

AAIAAAAAAAAAAwAAAAAAAAAAAAIAAAAAAAAAAAACAAAAAAAAAAAAAQAAAAAAAAAAAAEAAAAAAAAAAQAAAAAAAAUAAAAAAAAAAAABAAAAAAAAAAAAAQAAAAAAAQAAAAAAAAAAABIAAAAAAAAAAAEAAAAAAAAAAQAAAAAAAAAADQAAAAAAAAAAAAMAAAAAAAAAAAAKAAAAAAAAAAAXAAAAAAAAABUAAAAAAAAAAAABAAAAAAAAAAAAKAAAAAAABQAAAAAAAAAAAgAAAAAAAAAAAAEAAAAAAAAAAAkAAAAAAAAAAAABAAAAAAAABQAAAAAAAAAABQAAAAAAAAAAABQAAAAAAAAAIQAAAAAAAAAABgAAAAAAAAAACgAAAAAAAAAAAQAAAAAAAAAAAQAAAAAAAAAAAwAAAAAAAAAAAAEAAAAAAAAABQAAAAAAAAAAABkAAAAAAAAAAAABAAAAAAAAAAAAAgAAAAAAAAEAAAAAAAAAAQAAAAAAAAAAABIAAAAAAAAAACEAAAAAAAAAAAEAAAAAAAAACgAAAAAAAAAAAgAAAAAAAAAAACgAAAAAAAAAACIAAAAAAAAAAAAFAAAAAAAAAAAAAQAAAAAAAAAAAQAAAAAAAAABAAAAAAAAAAEAAAAAAAAAAQAAAAAAAAAAAQAAAAAAAAAAAQAAAAAAAAAABQAAAAAAAAAAAAEAAAAAAAAAAAEAAAAAAAAAAAIAAAAAAAAAAQAAAAAAAAAAAQAAAAAAAAAAAQAAAAAAAAAAAQAAAAAAAAAAAAIAAAAAAAAAAAEAAAAAAAAAAB0AAAAAAAAAAAEAAAAAAAAAAB4AAAAAAAAAAAEAAAAAAAAAAAACAAAAAAAAAAAAAgAAAAAAAAAKAAAAAAAAAAACAAAAAAAAAAIAAAAAAAAAAQAAAAAAAAAAAgAAAAAAAAAAAwAAAAAAAAAAAwAAAAAAAAAAAAEAAAAAAAAAAAABAAAAAAAAAAUAAAAAAAAAAAASAAAAAAAAAQAAAAAAAAAAAAEAAAAAAAAAAAADAAAAAAAAAQAAAAAAAAAAAQAAAAAAAAAAAwAAAAAAAAAAAAEAAAAAAAAAAAAYAAAAAAAACgAAAAAAAAAAAgAAAAAAAAAAAQAAAAAAAAAAQgAAAAAAAAAAAAoAAAAAAAAAAAEAAAAAAAAAAAEAAAAAAAAAAQAAAAAAAAAADQAAAAAAAAAAAQAAAAAAAAAAAAIAAAAAAAAAAAUAAAAAAAAAAAcAAAAAAAAAAQAAAAAAAAAAAgAAAAAAAAAACAAAAAAAAAAADQAAAAAAAAAAAAEAAAAAAAAAAAAFAAAAAAAAAAADAAAAAAAAAQAAAAAAAAAAAA4AAAAAAAAAAAAFAAAAAAAAAAAABQAAAAAAAAABAAAAAAAAAAMAAAAAAAAAAAIAAAAAAAAAAAABAAAAAAAAAgAAAAAAAAAAAAEAAAAAAAAAAAABAAAAAAAAAAADAAAAAAAAAAABAAAAAAAAAAAABQAAAAAAAAAAAQAAAAAAAgAAAAAAAAAAAAIAAAAAAAAAAAEAAAAAAAAAAAAYAAAAAAAACQAAAAAAAAAAAAMAAAAAAAAAGwAAAAAAAAAAAAMAAAAAAAAAAAEAAAAAAAAAAQAAAAAAAAAAAAEAAAAAAAAAAAADAAAAAAAAAAEAAAAAAAAAAgAAAAAAAAAABQAAAAAAAAAAAAEAAAAAAAAAAAIAAAAAAAAAAAEAAAAAAAAAAA0AAAAAAAAAAAABAAAAAAAAAAABAAAAAAAAAQAAAAAAAAAAAAEAAAAAAAAAAAsAAAAAAAAAAAEAAAAAAAAAAAUAAAAAAAAABQAAAAAAAAAAAAMAAAAAAAAAAAIAAAAAAAAAAAACAAAAAAAAAAAoAAAAAAAAAAAAAQAAAAAAAAAAJwAAAAAAAAEAAAAAAAAAHwAAAAAAAAAAAwAAAAAAAAAAAQAAAAAAAAAAAQAAAAAAAAAAAwAAAAAAAAAAAAUAAAAAAAAAAAACAAAAAAAAAQAAAAAAAAAAAAEAAAAAAAAAAAEAAAAAAAAAAAEAAAAAAAAAAAEAAAAAAAAAAQAAAAAAAAAAJQAAAAAAAAAAAgAAAAAAAAAAAQAAAAAAAAAAAAUAAAAAAAAAAAAFAAAAAAAAAAoAAAAAAAAAAAEAAAAAAAAAAQAAAAAAAAAAAQAAAAAAAAAAAAoAAAAAAAAAAgAAAAAAAAAAAAMAAAAAAAAAAgAAAAAAAAAAAAMAAAAAAAAAAAEAAAAAAAAAHgAAAAAAAAAAAAEAAAAAAAAAAAABAAAAAAAAKgAAAAAAAAAAAQAAAAAAAAAAACYAAAAAAAAAAQAAAAAAAAAAAAIAAAAAAAAAAAACAAAAAAAAAAAAAgAAAAAAAQAAAAAAAAAAAgAAAAAAAAAAAAUAAAAAAAAAAAUAAAAAAAAAAAAcAAAAAAAACgAAAAAAAAAAAQAAAAAAAAAAAAEAAAAAAAAAAAEAAAAAAAAAAQAAAAAAAAAAAAEAAAAAAAAAABkAAAAAAAAAAAoAAAAAAAAAAAEAAAAAAAAAAAIAAAAAAAAAAAAFAAAAAAAAAAEAAAAAAAAAAAABAAAAAAAAAAAKAAAAAAAAAAABAAAAAAAAADAAAAAAAAAAAQAAAAAAAAAAAAIAAAAAAAAAAAAFAAAAAAAAAAAAAQAAAAAABwAAAAAAAAAAAgAAAAAAAAAAAwAAAAAAAAAAAAEAAAAAAAAAAwAAAAAAAAAAAgAAAAAAAAAAAQAAAAAAAAAAAAEAAAAAAAAAAAAKAAAAAAAAKQAAAAAAAAAAAAUAAAAAAAAAAAABAAAAAAAAAAAAAQAAAAAAAAAAAAUAAAAAAAAAAAABAAAAAAAPAAAAAAAAAAABAAAAAAAAAAAFAAAAAAAAAgAAAAAAAAAAAAoAAAAAAAAAAAAKAAAAAAAAAAAAAQAAAAAAAAAAAQAAAAAAAAAAAQAAAAAAAAASAAAAAAAAAAAAAQAAAAAAAAAAAAwAAAAAAAEAAAAAAAAAAAAKAAAAAAAAAAAACgAAAAAAAAUAAAAAAAAAAAAKAAAAAAAAAQAAAAAAAAAAAQAAAAAAAAAAAAUAAAAAAAAAAAADAAAAAAAAJAAAAAAAAAAAAAEAAAAAAAAAAAIAAAAAAAAAAAMAAAAAAAAAAAACAAAAAAAAAAAUAAAAAAAAAAAACgAAAAAAAAMAAAAAAAAAAAIAAAAAAAAAAAoAAAAAAAAAAAABAAAAAAAAAAABAAAAAAAAAAEAAAAAAAAAAwAAAAAAAAAAAAMAAAAAAAAAGgAAAAAAAAAACgAAAAAAAAAAAB4AAAAAAAAAAwAAAAAAAAAADAAAAAAAAAAAAQAAAAAAAAAAAAIAAAAAAAAAAgAAAAAAAAAACgAAAAAAAAAAAAIAAAAAAAAAAAEAAAAAAAAABQAAAAAAAAAAAgAAAAAAAAAAAAEAAAAAAAAACwAAAAAAAAAAAAkAAAAAAAAAAAEAAAAAAAAAAAEAAAAAAAAAAAoAAAAAAAAAAAA+AAAAAAAAAwAAAAAAAAAAAwAAAAAAAAAAAQAAAAAAAAAAAwAAAAAAAAAAAAEAAAAAAAAAAgAAAAAAAAAAAAMAAAAAAAAAAAoAAAAAAAAAAAADAAAAAAAAAAAAJwAAAAAAAAAAAAIAAAAAAAAAAAIAAAAAAAAAAAMAAAAAAAAAAAEAAAAAAAAAAAMAAAAAAAACAAAAAAAAAAACAAAAAAAAAAAAAQAAAAAAAAoAAAAAAAAABQAAAAAAAAAAAAIAAAAAAAAAAwAAAAAAAAAAAAIAAAAAAAAAEQAAAAAAAAAACgAAAAAAAAAAAQAAAAAAAAAAAgAAAAAAAAAAAAIAAAAAAAAAAAAFAAAAAAAAAAAFAAAAAAAAAAAALQAAAAAAAAMAAAAAAAAAAgAAAAAAAAAADQAAAAAAAAAAAAkAAAAAAAAABQAAAAAAAAAAADIAAAAAAAAAAAIAAAAAAAAAAAEAAAAAAAAAAQAAAAAAAAAAAAwAAAAAAAAAEwAAAAAAAAAABQAAAAAAAAAADAAAAAAAAAAAAQAAAAAAAAAAAQAAAAAAAAAAAwAAAAAAAAAAAAEAAAAAAAAAAQAAAAAAAAAAAwAAAAAA"}}, "jackpots": {"2": {"name": "Grand", "start": 1000, "elasticity": 1500, "ratio": 1.5, "rate": 0.04, "minWager": 1.0}, "1": {"name": "Mid", "start": 100, "elasticity": 100, "ratio": 1.0, "rate": 0.02, "minWager": 0.0}, "0": {"name": "Mini", "start": 10, "elasticity": 10, "ratio": 1.0, "rate": 0.01, "minWager": 0.0}}, "jackpotMeters": {"2": 2239.52, "1": 188.44, "0": 15.58}, "jackpotTriggers": {"2": 2950.22, "1": 203.88, "0": 23.29}};
const $ = s => document.querySelector(s);
const NROWS = DATA.nrows, GAMEKEYS = Object.keys(DATA.games);
const BETS = [0.25,0.50,0.75,1.00,1.50,2.00,2.50,3.00,4.00,5.00];
const wrap = i => ((i-1)%NROWS)+1;
const money = c => "$"+(c/100).toFixed(2);
let pal=null, bytes=null, gameKey=null, betCents=250, mode="wl", seq=[], cand=new Set(), entry="";
const poolAt = i => pal[bytes[wrap(i)-1]];
const fmt = n => n.toLocaleString("en-US");

function allCand(){ const a=new Set(); for(let i=1;i<=NROWS;i++) a.add(i); return a; }
function loadGame(k){
  gameKey=k; const g=DATA.games[k];
  pal=g.palette;
  const bin=atob(g.idx); bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  seq=[]; cand=allCand();
}
function key(m){ return "wt_"+mode+"_"+gameKey; }
function persist(){ localStorage.setItem(key(), JSON.stringify(seq)); }
function loadSeq(){
  try{ seq=JSON.parse(localStorage.getItem(key())||"[]"); }catch(e){ seq=[]; }
  if(!Array.isArray(seq)) seq=[];
  refilter();
}
function refilter(){
  cand=allCand();
  const n=seq.length;
  for(let x=0;x<n;x++){
    const want=seq[x], keep=new Set();
    if(mode==="wl"){
      for(const c of cand){ if((poolAt(c+x)>0?1:0)===want) keep.add(c); }
    } else {
      for(const c of cand){ if(poolAt(c+x)===want) keep.add(c); }
    }
    cand=keep;
    if(!cand.size) break;
  }
}
function feed(raw){
  seq.push(mode==="wl" ? (raw>0?1:0) : Math.max(0,Math.round(raw)));
  refilter(); persist(); render();
}
function undo(){
  if(!seq.length) return;
  seq.pop(); refilter(); persist(); render();
}
function reset(){ seq=[]; cand=allCand(); localStorage.removeItem(key()); entry=""; render(); }

function addAmount(){
  const win=parseFloat(entry);
  if(isNaN(win)){ entry=""; render(); return; }
  const mult=Math.round(win*10000/betCents);
  if(Math.abs(win*10000/betCents-mult)>1e-3){
    const h=$("#amtHint");
    h.hidden=false;
    h.textContent = betCents===25
      ? win.toFixed(2)+" isn't a multiple of $0.25 — check the amount."
      : win.toFixed(2)+" isn't a multiple of "+money(betCents)+" — was it a Free Spin? Those are paid at $0.25 and belong in the $0.25 session.";
    entry=""; render();
    return;
  }
  $("#amtHint").hidden=true;
  entry=""; feed(mult);
}

function setMode(m){
  mode=m; entry="";
  $("#amtHint").hidden=true;
  $$(document,".seg button").forEach(b=>b.classList.toggle("on",b.dataset.mode===m));
  $("#wlBtns").hidden = (m!=="wl");
  $("#amtArea").hidden = (m!=="amt");
  $("#betCard").hidden = (m!=="amt");
  loadSeq(); render();
}
function $$(el,s){ return [...el.querySelectorAll(s)]; }

function render(){
  const n=seq.length, locked=cand.size===1;
  const big=$("#big"), bigN=$("#bigN"), bigL=$("#bigL");
  big.classList.toggle("locked",locked);
  if(locked){
    const base=wrap([...cand][0]+n);
    bigN.textContent="INDEX "+base;
    bigL.textContent="cursor locked · "+n+" spins";
  } else if(cand.size===0){
    big.classList.remove("locked");
    bigN.textContent="Ø";
    bigL.textContent="no index matches — undo / reset";
  } else {
    big.classList.remove("locked");
    bigN.textContent=fmt(cand.size);
    bigL.textContent="positions left · "+n+" spins";
  }
  // stats
  let w=0; for(const o of seq) if(o>0) w++;
  $("#stTotal").textContent=n; $("#stWins").textContent=w; $("#stLosses").textContent=n-w;
  let streak=0; for(let i=seq.length-1;i>=0;i--){ if(seq[i]!==seq[seq.length-1]) break; streak++; }
  $("#stStreak").textContent=streak;
  // entry + hint
  $("#entryVal").textContent = entry==="" ? "0.00" : entry;
  // howto
  $("#howto").textContent = mode==="wl"
    ? "Record each spin as WIN or LOSS (no amounts). Every result erases the positions that can't be there — exact lock takes ~40–110 spins (the pool has few distinct frames, so patterns repeat)."
    : "Type the cash amount on the win meter (e.g. 165.00), then ADD — or tap LOSS. Exact amounts lock the cursor in ~20–40 spins, and shrink the field far faster than win/loss.";
  // info
  const info=$("#info");
  if(!n){
    info.innerHTML = mode==="wl"
      ? '<span class="hl">Ready.</span> Tap WIN or LOSS after every spin to shrink the candidate positions.'
      : '<span class="hl">Ready.</span> Type the win amount shown on the meter and hit ADD (or LOSS for nothing) — exact $ amounts find the index fastest.';
  } else if(cand.size===0){
    info.innerHTML='No pool position matches — either the wrong <b>game</b>'+
      (mode==="amt"?'/<b>bet</b>':'')+' or a missed spin.<br>'+
      '<span class="bad">UNDO</span> one or <span class="bad">RESET</span>.';
  } else if(locked){
    const base=wrap([...cand][0]+n);
    const bits=[];
    for(let k=0;k<3;k++){
      const v=poolAt(base+k);
      bits.push(mode==="wl"
        ? (v>0?"WIN":"loss")
        : (v>0 ? money(v/100*betCents)+" (×"+(v/100).toFixed(0)+")" : "loss"));
    }
    info.innerHTML='<b>Cursor:</b> index '+base+' ← the frame the next spin reads<br><b>Next 3:</b> '+bits.join(' &nbsp;·&nbsp; ');
  } else {
    let winNext=0, maxMult=0;
    for(const c of cand){ const v=poolAt(c+n); if(v>0){ winNext++; if(v>maxMult)maxMult=v; } }
    if(mode==="wl"){
      info.innerHTML='<b>'+fmt(cand.size)+'</b> possible starting pages'+
        '<br>next spin: <span class="ok">'+(winNext/cand.size*100).toFixed(1)+'% win</span>'+
        ' · best possible ×'+(maxMult/100).toFixed(0)+' — keep feeding WIN / LOSS';
    } else {
      info.innerHTML='<b>'+fmt(cand.size)+'</b> possible starting pages'+
        '<br>best next win: <span class="ok">'+money(maxMult/100*betCents)+'</span>'+
        ' (&times;'+(maxMult/100).toFixed(0)+') — keep entering amounts, it locks fast';
    }
  }
  // strip
  const strip=$("#strip"); strip.innerHTML="";
  seq.slice(-30).forEach(o=>{
    const c=document.createElement("span");
    if(mode==="wl"){ c.className="chip "+(o?"win":"loss"); c.textContent=o?"WIN":"0"; }
    else { c.className="chip "+(o?"win":"loss"); c.textContent = o? money(o/100*betCents) : "0"; }
    strip.appendChild(c);
  });
}

// ---- boot ----
(function(){
  const g=$("#game");
  GAMEKEYS.forEach(k=>{ const o=document.createElement("option"); o.value=k; o.textContent=DATA.games[k].label; g.appendChild(o); });
  g.onchange=()=>{ loadGame(g.value); loadSeq(); render(); localStorage.setItem("wt_game",g.value); };
  const b=$("#bet");
  BETS.forEach(v=>{ const o=document.createElement("option"); o.value=Math.round(v*100); o.textContent="$"+v.toFixed(2); b.appendChild(o); });
  b.value=betCents;
  b.onchange=()=>{ betCents=+b.value; localStorage.setItem("wt_bet",betCents); render(); };

  $("#winBtn").onclick=()=>feed(1);
  $("#lossBtn").onclick=()=>feed(0);
  $("#undoBtn1").onclick=undo; $("#resetBtn1").onclick=()=>{ if(confirm("Clear this session?")) reset(); };
  $("#undoBtn2").onclick=undo; $("#resetBtn2").onclick=()=>{ if(confirm("Clear this session?")) reset(); };

  $$(document,".seg button").forEach(btn=>btn.onclick=()=>{ setMode(btn.dataset.mode); localStorage.setItem("wt_mode",btn.dataset.mode); });
  $$(document,".pad button").forEach(btn=>btn.onclick=()=>{
    const k=btn.dataset.k;
    if(k==="del") entry=entry.slice(0,-1);
    else if(k==="loss"){ entry=""; feed(0); return; }
    else if(k==="add"){ addAmount(); return; }
    else if(k==="."){ if(!entry.includes(".")) entry=(entry||"0")+"."; }
    else entry=(entry==="0"?"":entry)+k;
    render();
  });

  mode = localStorage.getItem("wt_mode")==="amt" ? "amt" : "wl";
  betCents=+(localStorage.getItem("wt_bet")||250);
  b.value=betCents;
  loadGame(localStorage.getItem("wt_game")||GAMEKEYS[0]);
  g.value=gameKey;
  setMode(mode);
})();
</script>
